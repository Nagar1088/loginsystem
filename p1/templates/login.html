{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/login.css' %}">
  <title>Login/Signup</title>
</head>
<body>
  <div class="main">
    <input type="checkbox" id="chk" aria-hidden="true">

    <!-- Login Form -->
    <div class="login">
      <form method="POST" action="{% url 'login' %}">
        {% csrf_token %}
        <label for="chk" aria-hidden="true">Login</label>
        <input type="email" name="email" placeholder="Email" value="{{ email|default:'' }}" required>
        <input type="password" name="pswd" placeholder="Password" required>
        <button type="submit">Login</button>
        <div class="links">
          <a href="{% url 'forget' %}">Forgot Password?</a>
        </div>
        {% if messages %}
        <div class="messages">
          {% for message in messages %}
            <p class="{{ message.tags }}">{{ message }}</p>
          {% endfor %}
        </div>
        {% endif %}
      </form>
    </div>

    <!-- Signup Form -->
    <div class="signup">
      <form method="POST" action="{% url 'signup' %}">
        {% csrf_token %}
        <label for="chk" aria-hidden="true">Sign up</label>
        <input type="text" name="first_name" placeholder="First Name" pattern="[A-Za-z ]{1,30}" required>
        <input type="text" name="last_name" placeholder="Last Name" pattern="[A-Za-z ]{1,30}" required>
        <input type="email" name="email" placeholder="Email" required>
        <input type="tel" id="phone" name="phone" placeholder="Phone Number" value="{{ phone|default:'' }}" maxlength="13" required>
        <input type="password" name="pswd" placeholder="Password (min 8 chars)" minlength="8" required>
        <input type="password" name="confirm_pswd" placeholder="Confirm Password" minlength="8" required>
        <button type="submit">Sign up</button>
      </form>
    </div>
  </div>

  <script src="{% static 'js/login.js' %}"></script>
</body>
</html>

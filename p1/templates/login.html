{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/login.css' %}">
  <title>Login/Signup</title>
</head>
<body>
  <div class="main">
    <input type="checkbox" id="chk" aria-hidden="true">

    <!-- Login Form -->
    <div class="login">
      <form method="POST" action="{% url 'login' %}">
        {% csrf_token %}
        <label for="chk" aria-hidden="true">Login</label>
        <input type="email" name="email" placeholder="Email" value="{{ email|default:'' }}" required>
        <input type="password" name="pswd" placeholder="Password" required>
        <button type="submit">Login</button>
        <div class="links">
          <a href="{% url 'forget' %}">Forgot Password?</a>
        </div>
      </form>
    </div>

    <!-- Signup Form -->
    <div class="signup">
      <form method="POST" action="{% url 'signup' %}">
        {% csrf_token %}
        <label for="chk" aria-hidden="true">Sign up</label>
        <input type="text" name="first_name" placeholder="First Name" pattern="[A-Za-z ]{1,30}" title="Only letters (max 30)" required>
        <input type="text" name="last_name" placeholder="Last Name" pattern="[A-Za-z ]{1,30}" title="Only letters (max 30)" required>
        <input type="email" name="email" placeholder="Email" required>
        <input type="tel" id="phone" name="phone" placeholder="Phone Number" value="{{ phone|default:'' }}" maxlength="13" required>
        <input type="password" name="pswd" placeholder="Password (min 8 chars)" minlength="8" required>
        <input type="password" name="confirm_pswd" placeholder="Confirm Password" minlength="8" required>
        <button type="submit">Sign up</button>
      </form>
    </div>
  </div>
</body>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const phoneInput = document.getElementById("phone");

    phoneInput.addEventListener("input", function () {
      let raw = phoneInput.value.replace(/\D/g, ""); // remove non-digits

      if (raw.startsWith("91")) {
        raw = raw.slice(2); // remove extra 91 if user types it manually
      }

      if (raw.length > 10) {
        raw = raw.slice(0, 10); // limit to 10 digits
      }

      if (raw.length > 0) {
        phoneInput.value = "+91" + raw;
      } else {
        phoneInput.value = "";
      }
    });

    phoneInput.addEventListener("focus", function () {
      if (phoneInput.value.trim() === "") {
        phoneInput.value = "+91";
      }
    });

    phoneInput.addEventListener("blur", function () {
      if (phoneInput.value === "+91") {
        phoneInput.value = "";
      }
    });
  });
  </script>

<!-- Add this script to your login.html -->
<script>
  document.addEventListener('DOMContentLoaded', function() {
      // Phone number validation
      const phoneInput = document.querySelector('input[name="phone"]');
      if (phoneInput) {
          phoneInput.addEventListener('input', function(e) {
              this.value = this.value.replace(/[^0-9+]/g, '');
          });
      }

      // Password validation
      const passwordInput = document.querySelector('input[name="pswd"]');
      if (passwordInput) {
          passwordInput.addEventListener('input', function(e) {
              if (this.value.length < 8) {
                  this.setCustomValidity('Password must be at least 8 characters');
              } else {
                  this.setCustomValidity('');
              }
          });
      }
  });
  </script>
</html>

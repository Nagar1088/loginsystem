{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Change Password</title>
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/change_password.css' %}">
  </head>
<body>
  <body>
    <a href="{% url 'logout' %}" style="position: absolute; top: 20px; right: 20px; background-color: #e74c3c; color: #fff; padding: 10px 15px; border-radius: 5px; text-decoration: none; font-weight: bold;">Logout</a>
  <div class="main">
      <form method="POST" action="{% url 'change_password' %}">
          {% csrf_token %}  <!-- THIS IS CRITICAL -->
          <label>Change Password</label>

          <input type="password" name="old_password" placeholder="Current Password" required>
          <input type="password" name="new_password" placeholder="New Password" required>
          <input type="password" name="confirm_password" placeholder="Confirm New Password" required>

          <button type="submit">Change Password</button>

          {% if messages %}
          <div class="messages">
              {% for message in messages %}
              <p{% if message.tags %} class="{{ message.tags }}"{% endif %}>{{ message }}</p>
              {% endfor %}
          </div>
          {% endif %}
      </form>
  </div>
</body>
</html>
